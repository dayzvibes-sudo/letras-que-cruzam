:root{

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  overflow:hidden;
}

#top{width:min(96vw,520px);display:flex;align-items:center;justify-content:space-between;padding:8px 4px 2px}
#bk{height:38px;width:38px;border-radius:50%;background:var(--bar);color:var(--tx);font-size:18px;display:flex;align-items:center;justify-content:center}
#lvl-tag{font-size:13px;font-weight:700;color:var(--ai);background:var(--bar);padding:4px 12px;border-radius:14px}
h1{font-size:clamp(22px,6.5vw,30px);margin:2px 12px 8px;text-align:center;line-height:1.1;font-weight:800;letter-spacing:-.02em}

#sc{display:flex;gap:12px;align-items:center;font-weight:600;margin-bottom:8px;font-size:15px}
#sc b{background:var(--bar);padding:4px 16px;border-radius:10px;font-size:20px;min-width:36px;text-align:center;transition:transform .2s}
#sc b.y{color:var(--bl)}
#sc b.ai-s{color:var(--ai)}

#g{display:grid;grid-template-columns:repeat(8,var(--cs));border:2px solid #7d8799;background:var(--cb);box-shadow:0 4px 16px #00000012}
.c{
  width:var(--cs);height:var(--cs);
  border-right:1px solid var(--cb);border-bottom:1px solid var(--cb);
  box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:calc(var(--cs)*.54);background:var(--cl);
  position:relative;transition:background .15s;
}
.c:nth-child(8n){border-right:0}
.c:nth-child(n+73){border-bottom:0}

.k{
  background:var(--ct);font-size:calc(var(--cs)*.145);font-weight:700;
  text-align:center;line-height:1.05;padding:2px 3px;text-transform:uppercase;
  color:var(--tx);overflow:hidden;cursor:pointer;
}
.k.has-r{padding-right:7px}
.k.has-b{padding-bottom:6px}
.k.corner{background:#c5d8f0;cursor:default}
.k i{position:absolute;font-style:normal;font-size:calc(var(--cs)*.17);color:#5c7499;pointer-events:none}
.k .r{right:1px;top:50%;transform:translateY(-50%)}
.k .b{bottom:-1px;left:50%;transform:translateX(-50%)}

.s{flex-direction:column;padding:0}
.s div{
  flex:1;width:100%;display:flex;align-items:center;justify-content:center;
  position:relative;font-size:calc(var(--cs)*.128);padding:0 6px 0 3px;
  box-sizing:border-box;line-height:1.02;overflow:hidden;
}
.s div:first-child{border-bottom:1px solid #aebfd9}
.s div:last-child{padding:0 3px 4px 3px}
.s .b{bottom:-2px}

.pc-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pc-aff{font-size:calc(var(--cs)*.16);font-weight:800;text-transform:none;margin-bottom:1px}
.pc{font-size:calc(var(--cs)*.42);text-transform:none;line-height:1}
.s .pc{font-size:calc(var(--cs)*.23)}

.me{color:var(--me)}
.ai{color:var(--ai)}
.pd{
  background:linear-gradient(180deg,#fdf1dc,var(--ti));
  color:var(--tt);border-radius:4px;
  box-shadow:inset 0 0 0 1.5px var(--tib),0 2px 4px #0002;
  cursor:grab;z-index:2;
}
.pd.sel{box-shadow:inset 0 0 0 2.5px var(--bl),0 2px 6px #0003}
.hl-word{background:#fae6c3 !important;box-shadow:inset 0 0 0 2px var(--bl)}
.hl-clue{background:#eef5ff !important}
.hint{animation:p .55s 3}@keyframes p{50%{background:var(--ok)}}

.badge{
  position:absolute;top:-7px;right:-6px;
  background:var(--bl);color:#fff;font-size:11px;font-weight:800;
  padding:1px 5px;border-radius:8px;z-index:10;line-height:1.2;
  box-shadow:0 2px 4px #0004;animation:pop .35s ease-out;
}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

#ms{min-height:20px;margin:6px 12px 2px;font-size:13px;font-weight:600;color:var(--ai);text-align:center;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#rk{display:flex;gap:10px;margin:4px 0 6px;height:calc(var(--cs)*.92);align-items:center}
.t{
  width:calc(var(--cs)*.9);height:calc(var(--cs)*.9);border-radius:8px;
  background:linear-gradient(180deg,#fdf1dc,var(--ti));color:var(--tt);
  border:1.5px solid var(--tib);box-shadow:0 3px 0 #c9a673,0 4px 6px #0002;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:calc(var(--cs)*.52);touch-action:none;cursor:grab;

.t.e{background:var(--bar);border:1.5px dashed var(--cb);box-shadow:none;cursor:default}
.t.sel{outline:3px solid var(--bl);transform:translateY(-3px)}
.gh{position:fixed;transform:translate(-50%,-50%) scale(1.08);pointer-events:none;z-index:50;opacity:.95;box-shadow:0 8px 18px #0004}

#bar{display:flex;gap:14px;align-items:center;width:min(92vw,440px);margin:4px 0 8px}
button{font:inherit;border:0;border-radius:28px;height:52px;cursor:pointer;transition:transform .1s,opacity .15s}
button:active:not(:disabled){transform:scale(.96)}
#sh,#ht{width:52px;background:var(--bar);color:var(--bl);font-size:22px;position:relative;flex:none;display:flex;align-items:center;justify-content:center}
#go{flex:1;background:var(--bl);color:#fff;font-weight:700;font-size:18px;box-shadow:0 4px 12px #0a84ff40}
#go:disabled{background:var(--bar);color:var(--ai);box-shadow:none;cursor:default}
#ht em{position:absolute;top:-4px;right:-4px;background:var(--bl);color:#fff;border-radius:50%;width:21px;height:21px;font:700 12px/21px system-ui}

body.m>:not(#mn){display:none}
body:not(.m) #mn{display:none}
#mn{width:min(94vw,500px);flex:1;min-height:0;overflow-y:auto;padding:16px 4px 32px;display:flex;flex-direction:column;gap:14px}
.m-head{text-align:center;padding:8px 0 4px}
.m-head h1{margin:0 0 4px;font-size:30px}
.m-head p{margin:0;color:var(--ai);font-size:14px}
.stats-card{
  display:flex;justify-content:space-around;background:var(--bar);
  padding:12px;border-radius:16px;text-align:center;
}
.stats-card div b{display:block;font-size:20px;color:var(--bl)}
.stats-card div span{font-size:12px;color:var(--ai);font-weight:600}
#resume-btn{
  background:linear-gradient(135deg,#0a84ff,#0066cc);color:#fff;
  border-radius:16px;height:auto;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 6px 16px #0a84ff35;text-align:left;
}
#resume-btn strong{display:block;font-size:17px}
#resume-btn small{font-size:13px;opacity:.9}
#resume-btn span.arr{font-size:22px;font-weight:800}

.lv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv-btn{
  height:52px;border-radius:14px;background:var(--bar);color:var(--tx);
  font-weight:800;font-size:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;
}
.lv-btn.won{background:var(--bl);color:#fff}
.lv-btn.curr{outline:2.5px solid var(--bl);color:var(--bl)}
.lv-btn.won.curr{color:#fff}
.lv-btn small{font-size:10px;font-weight:600;opacity:.85}

#ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:30;backdrop-filter:blur(2px)}
#ov[hidden]{display:none}
#ov .box{background:var(--bg);padding:26px 28px;border-radius:22px;text-align:center;width:min(84vw,340px);box-shadow:0 12px 32px #0005}
#ov h2{margin:0 0 8px;font-size:26px}
#ov p{font-size:18px;font-weight:600;color:var(--ai);margin:0 0 20px;white-space:pre-line}
#ov .btns{display:flex;gap:10px}
#ov .btns button{flex:1;font-weight:700;font-size:16px}
#ov-m{background:var(--bar);color:var(--tx)}
#nw{background:var(--bl);color:#fff}

const BASE_DICT = [];
const WORD_MAP = {};
const seenBase = new Set();
RAW_WORDS.trim().split('\n').forEach(line => {
  const parts = line.split('|');
  const w = parts[0].trim().toUpperCase().replace(/[^A-Z]/g, '');
  const t = (parts[1] || '').trim();
  const e = (parts[2] || '').trim();
  const aff = (parts[3] || '').trim();
  if (w.length >= 2 && w.length <= 5 && !seenBase.has(w)) {
    seenBase.add(w);
    const obj = { w, t, e, aff, f: 0 };
    BASE_DICT.push(obj);
    WORD_MAP[w] = obj;
  }
});

const FILL_DICT = [];
const seenFill = new Set(seenBase);
BASE_DICT.forEach(b => {
  if (b.w.length === 5) {
    const sub2 = b.w.slice(1, 3);
    const masked2 = b.w.slice(0, 1) + '__' + b.w.slice(3);
    if (!seenFill.has(sub2)) {
      seenFill.add(sub2);
      FILL_DICT.push({ w: sub2, t: masked2, e: '', aff: '', f: 1 });
    }
  }
});

const ALL_WORDS = BASE_DICT.concat(FILL_DICT);
const WORDS_BY_LEN = {};
for (let l = 2; l <= 5; l++) WORDS_BY_LEN[l] = [];
ALL_WORDS.forEach(item => WORDS_BY_LEN[item.w.length].push(item));

const rng = s => () => {
  s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

function getClueFontStyle(txt, isSplit) {
  const words = txt.split(/\s+/);
  const maxW = words.reduce((m, w) => Math.max(m, w.length), 0);
  const len = txt.length;
  let factor = isSplit ? 0.128 : 0.146;

  if (maxW >= 10) factor = Math.min(factor, 0.105);
  else if (maxW === 9) factor = Math.min(factor, 0.116);
  else if (maxW === 8) factor = Math.min(factor, 0.128);
  else if (maxW === 7) factor = Math.min(factor, 0.138);

  if (len >= 18) factor = Math.min(factor, 0.112);
  else if (len >= 15) factor = Math.min(factor, 0.124);

  return `style="font-size:calc(var(--cs)*${factor.toFixed(3)})"`;
}

function renderClueContent(b, lvl, isSplit = false) {
  const picChance = Math.max(0.28, 0.62 - (lvl * 0.003));
  const usePic = b.e && (((b.w.charCodeAt(0) * 11 + b.w.length * 17 + lvl * 7) % 100) < picChance * 100);
  if (usePic) {
    return `<div class="pc-wrap">${b.aff ? `<span class="pc-aff">${b.aff}</span>` : ''}<span class="pc">${b.e}</span></div>`;
  }
  return `<span ${getClueFontStyle(b.t, isSplit)}>${b.t}</span>`;
}

function ck(q, r, c, lvl) {
  if (r === 0 && c === 0) return '<div class="c k corner"></div>';
  if (!q || (!q.a && !q.d)) return '<div class="c k corner"></div>';
  if (q.a && q.d) {
    return `<div class="c k s" data-kr="${r}" data-kc="${c}"><div>${renderClueContent(q.a, lvl, true)}<i class="r">▸</i></div><div>${renderClueContent(q.d, lvl, true)}<i class="b">▾</i></div></div>`;
  }
  const dirCls = q.a ? 'has-r' : 'has-b';
  return `<div class="c k ${dirCls}" data-kr="${r}" data-kc="${c}">${renderClueContent(q.a || q.d, lvl, false)}<i class="${q.a ? 'r' : 'b'}">${q.a ? '▸' : '▾'}</i></div>`;
}

function extractSlots(g) {
  const slots = [];
  for (let r = 1; r < R; r++) {
    let c = 1;
    while (c < C) {
      if (g[r][c] === 1) {
        const c0 = c;
        while (c < C && g[r][c] === 1) c++;
        const len = c - c0;
        if (len >= 2) {
          const cells = [];
          for (let i = 0; i < len; i++) cells.push([r, c0 + i]);
          slots.push({ id: slots.length, r, c: c0, d: 0, len, clueR: r, clueC: c0 - 1, word: null, cells, cross: [] });
        }
      } else c++;
    }
  }
  for (let c = 1; c < C; c++) {
    let r = 1;
    while (r < R) {
      if (g[r][c] === 1) {
        const r0 = r;
        while (r < R && g[r][c] === 1) r++;
        const len = r - r0;
        if (len >= 2) {
          const cells = [];
          for (let i = 0; i < len; i++) cells.push([r0 + i, c]);
          slots.push({ id: slots.length, r: r0, c, d: 1, len, clueR: r0 - 1, clueC: c, word: null, cells, cross: [] });
        }
      } else r++;
    }
  }
  for (let i = 0; i < slots.length; i++) {
    for (let j = i + 1; j < slots.length; j++) {
      if (slots[i].d === slots[j].d) continue;
      const setA = new Set(slots[i].cells.map(([y, x]) => y + ',' + x));
      if (slots[j].cells.some(([y, x]) => setA.has(y + ',' + x))) {
        slots[i].cross.push(slots[j]);
        slots[j].cross.push(slots[i]);
      }
    }
  }
  return slots;
}

function solveLayout(g, slots, rn, lvl, timeLimitMs = 75) {
  if (!slots.length || slots.some(s => !WORDS_BY_LEN[s.len] || !WORDS_BY_LEN[s.len].length)) return null;

  const t0 = performance.now();
  const grid = Array.from({ length: R }, () => Array(C).fill(null));
  const used = new Set();
  const allowFill = lvl >= 4;
  const pools = {};

  for (let l = 2; l <= 5; l++) {
    const arr = WORDS_BY_LEN[l].filter(w => allowFill || !w.f).slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (rn() * (i + 1)) | 0;
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    pools[l] = arr;
  }

  function matches(item, s) {
    if (used.has(item.w)) return false;
    for (let i = 0; i < s.len; i++) {
      const [y, x] = s.cells[i];
      const ch = grid[y][x];
      if (ch !== null && ch !== item.w[i]) return false;
    }
    return true;
  }

  function getCandidates(s) {
    const out = [];
    const pool = pools[s.len];
    for (let k = 0; k < pool.length; k++) {
      if (matches(pool[k], s)) out.push(pool[k]);
    }
    return out;
  }

  function hasAnyCandidate(s) {
    const pool = pools[s.len];
    for (let k = 0; k < pool.length; k++) {
      if (matches(pool[k], s)) return true;
    }
    return false;
  }

  let steps = 0;

  function backtrack(assignedCount) {
    if (assignedCount === slots.length) return true;
    if ((++steps & 63) === 0 && (performance.now() - t0) > timeLimitMs) return false;

    let bestSlot = null;
    let bestCands = null;

    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (s.word !== null) continue;
      const cands = getCandidates(s);
      if (cands.length === 0) return false;
      if (!bestCands || cands.length < bestCands.length) {
        bestSlot = s;
        bestCands = cands;
        if (cands.length === 1) break;
      }
    }

    const prevChars = bestSlot.cells.map(([y, x]) => grid[y][x]);

    for (let i = 0; i < bestCands.length; i++) {
      const cand = bestCands[i];
      bestSlot.word = cand;
      used.add(cand.w);

      for (let cIdx = 0; cIdx < bestSlot.len; cIdx++) {
        const [y, x] = bestSlot.cells[cIdx];
        grid[y][x] = cand.w[cIdx];
      }

      let ok = true;
      for (let c = 0; c < bestSlot.cross.length; c++) {
        const other = bestSlot.cross[c];
        if (other.word === null && !hasAnyCandidate(other)) {
          ok = false;
          break;
        }
      }

      if (ok && backtrack(assignedCount + 1)) return true;

      for (let cIdx = 0; cIdx < bestSlot.len; cIdx++) {
        const [y, x] = bestSlot.cells[cIdx];
        grid[y][x] = prevChars[cIdx];
      }
      used.delete(cand.w);
      bestSlot.word = null;
    }
    return false;
  }

  if (backtrack(0)) return { g, slots, grid };
  return null;
}

function buildFallbackBoard() {
  const g = FALLBACK_GRID.map(row => row.map(v => v ? 1 : 0));
  const slots = extractSlots(g);
  slots.forEach(s => {
    const w = s.cells.map(([y, x]) => FALLBACK_GRID[y][x]).join('');
    s.word = WORD_MAP[w] || { w, t: w, e: '', aff: '', f: 0 };
  });
  return { g, slots, grid: FALLBACK_GRID.map(r => r.slice()) };
}

function generateBoard(lvl) {
  const rn = rng(lvl * 9973 + 31337);
  const startTpl = (lvl - 1) % BASE_TEMPLATES.length;
  const baseFlip = Math.floor((lvl - 1) / BASE_TEMPLATES.length) % 2;

  // Apenas reflexão vertical (flipV): mantém sempre a coluna 1 e a linha 1 jogáveis
  // garantindo que TODAS as casas do topo e da barra lateral esquerda têm pistas!
  for (let attempt = 0; attempt < BASE_TEMPLATES.length * 2; attempt++) {
    const base = BASE_TEMPLATES[(startTpl + attempt) % BASE_TEMPLATES.length];
    const flipV = (baseFlip + Math.floor(attempt / BASE_TEMPLATES.length)) % 2;

    const g = Array.from({ length: R }, (_, r) =>
      Array.from({ length: C }, (_, c) => {
        if (r === 0 || c === 0) return 0;
        const sr = flipV ? (R - r) : r;
        return base[sr][c];
      })
    );
    const slots = extractSlots(g);
    const solved = solveLayout(g, slots, rn, lvl, 75);
    if (solved) return solved;
  }
  return buildFallbackBoard();
}

    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        if (solved.grid[r][c] !== null) sol[r][c] = solved.grid[r][c];
      }
    }

    solved.slots.forEach(s => {
      clue[s.clueR][s.clueC][s.d === 0 ? 'a' : 'd'] = s.word;
      W.push(s.cells);
      W_INFO.push({
        clueR: s.clueR,
        clueC: s.clueC,
        dir: s.d === 0 ? '▸' : '▾',
        text: s.word.t + (s.word.e ? ' ' + s.word.e : '')
      });
    });

    me = 0; op = 0;
    hints = 3;
    done = new Set();
    rack = [null, null, null, null, null];
    deal();
    msg('Toca numa pista azul para ler ou arrasta as letras.');
    saveActiveGame();
  }
  draw();
}

function showMenu() {
  if (sol && !full() && !busy) saveActiveGame();
  document.body.className = 'm';
  const wonCount = Object.keys(saveData.won).length;
  let nextLvl = 1;
  for (let i = 1; i <= TOTAL_LEVELS; i++) {
    if (!saveData.won[i]) { nextLvl = i; break; }
  }

  let html = `
    <div class="m-head">
      <h1>Palavras Cruzadas</h1>
      <p>Desafia o oponente • v10</p>
    </div>
    <div class="stats-card">
      <div><b>${wonCount}/${TOTAL_LEVELS}</b><span>Níveis Vencidos</span></div>
      <div><b>Nível ${nextLvl}</b><span>Próximo Desafio</span></div>
    </div>
  `;

  if (saveData.active) {
    const a = saveData.active;
    html += `
      <button id="resume-btn">
        <div>
          <strong>Continuar Nível ${a.LN}</strong>
          <small>Pontuação atual: Você ${a.me} – ${a.op} Oponente</small>
        </div>
        <span class="arr">▶</span>
      </button>
    `;
  }

  html += `<div class="lv-grid">`;
  for (let i = 1; i <= TOTAL_LEVELS; i++) {
    const isWon = !!saveData.won[i];
    const isCurr = i === nextLvl;
    html += `<button class="lv-btn${isWon ? ' won' : ''}${isCurr ? ' curr' : ''}" data-n="${i}">
      ${i}
      ${isWon ? '<small>★</small>' : ''}
    </button>`;
  }
  html += `</div>`;

  $('mn').innerHTML = html;
  if ($('resume-btn')) {
    $('resume-btn').onclick = () => startLevel(saveData.active.LN, saveData.active);
  }
}

function deal() {
  const needed = {};
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      if (sol[r][c] && !val[r][c]) needed[sol[r][c]] = (needed[sol[r][c]] || 0) + 1;
    }
  }
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      if (pend[r][c] && needed[pend[r][c].l] > 0) needed[pend[r][c].l]--;
    }
  }
  rack = rack.map(l => l && needed[l] > 0 ? (needed[l]--, l) : null);
  const pool = [];
  for (const l in needed) {
    for (let i = 0; i < needed[l]; i++) pool.push(l);
  }
  shuf(pool);
  rack = rack.map((l, idx) => {
    const usedByPend = pend.some(row => row.some(p => p && p.s === idx));
    if (usedByPend) return null;
    return l || pool.pop() || null;
  });
}

const msg = t => $('ms').textContent = t;
const full = () => sol.every((row, r) => row.every((s, c) => !s || val[r][c]));
const hasPend = () => pend.some(r => r.some(x => x));

function checkCompletedWords() {
  let pts = 0;
  badges = [];
  hlCells = new Set();
  W.forEach((w, i) => {
    if (!done.has(i) && w.every(([y, x]) => val[y][x])) {
      done.add(i);
      pts += w.length;
      w.forEach(([y, x]) => hlCells.add(y + ',' + x));
      const last = w[w.length - 1];
      badges.push({ r: last[0], c: last[1], pts: '+' + w.length });
    }
  });
  if (badges.length) {
    setTimeout(() => { badges = []; hlCells = new Set(); draw(); }, 1800);
  }
  return pts;
}

function draw() {
  let h = '';
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      const s = sol[r][c], q = clue[r][c];
      if (!s) {
        h += ck(q, r, c, LN);
      } else {
        const v = val[r][c], p = pend[r][c];
        const isHl = hlCells.has(r + ',' + c);
        const isClueHl = hlClue && hlClue.has(r + ',' + c);
        const isHint = hc && hc[0] === r && hc[1] === c;
        const isSel = p && sel && sel.type === 'board' && sel.r === r && sel.c === c;
        const badge = badges.find(b => b.r === r && b.c === c);

        let cls = 'c';
        if (v) cls += ' ' + own[r][c];
        else if (p) cls += ' pd' + (isSel ? ' sel' : '');
        if (isHl) cls += ' hl-word';
        else if (isClueHl) cls += ' hl-clue';
        if (isHint) cls += ' hint';

        h += `<div class="${cls}" data-r="${r}" data-c="${c}">
          ${v || (p ? p.l : '')}
          ${badge ? `<span class="badge">${badge.pts}</span>` : ''}
        </div>`;
      }
    }
  }
  $('g').innerHTML = h;

  $('rk').innerHTML = rack.map((l, i) => {
    const isSel = sel && sel.type === 'rack' && sel.s === i;
    return l
      ? `<div class="t${isSel ? ' sel' : ''}" data-s="${i}">${l}</div>`
      : `<div class="t e" data-s="${i}"></div>`;
  }).join('');

  $('a').textContent = me;
  $('b').textContent = op;
  $('hn').textContent = hints;
  $('go').textContent = hasPend() ? 'Enviar' : 'Passar';
  $('go').disabled = !!busy;
  $('ht').disabled = !!busy || !hints;
}

function placeFromRack(s, r, c) {
  if (busy || rack[s] == null || !sol[r][c] || val[r][c]) return;
  if (pend[r][c]) {
    const old = pend[r][c];
    pend[r][c] = { l: rack[s], s };
    rack[s] = old.l;
  } else {
    pend[r][c] = { l: rack[s], s };
    rack[s] = null;
  }
  sel = null;
  saveActiveGame();
  draw();
}

function moveBoardTile(r1, c1, r2, c2) {
  if (busy || (r1 === r2 && c1 === c2) || !pend[r1][c1] || !sol[r2][c2] || val[r2][c2]) return;
  const moving = pend[r1][c1];
  const target = pend[r2][c2];
  pend[r2][c2] = moving;
  pend[r1][c1] = target || null;
  sel = null;
  saveActiveGame();
  draw();
}

function returnToRack(r, c, targetSlot = null) {
  const p = pend[r][c];
  if (!p) return;
  if (targetSlot != null && rack[targetSlot] == null) {
    rack[targetSlot] = p.l;
  } else if (rack[p.s] == null) {
    rack[p.s] = p.l;
  } else {
    const free = rack.indexOf(null);
    if (free !== -1) rack[free] = p.l;
  }
  pend[r][c] = null;
  sel = null;
  saveActiveGame();
  draw();
}

$('rk').addEventListener('pointerdown', e => {
  const t = e.target.closest('.t[data-s]');
  if (!t || busy) return;
  const s = +t.dataset.s;
  if (!rack[s]) {
    if (sel && sel.type === 'board') returnToRack(sel.r, sel.c, s);
    return;
  }

  const x0 = e.clientX, y0 = e.clientY;
  let ghost = null;

  const mv = ev => {
    if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) {
      ghost = t.cloneNode(true);
      ghost.className = 't gh';
      document.body.append(ghost);
    }
    if (ghost) {
      ghost.style.left = ev.clientX + 'px';
      ghost.style.top = (ev.clientY - 36) + 'px';
    }
  };

  const up = ev => {
    removeEventListener('pointermove', mv);
    removeEventListener('pointerup', up);
    removeEventListener('pointercancel', up);
    if (ghost) {
      ghost.remove();
      const el = document.elementFromPoint(ev.clientX, ev.clientY - 36);
      const cell = el && el.closest('.c[data-r]');
      const slot = el && el.closest('.t[data-s]');
      if (cell) {
        placeFromRack(s, +cell.dataset.r, +cell.dataset.c);
      } else if (slot && +slot.dataset.s !== s) {
        const s2 = +slot.dataset.s;
        [rack[s], rack[s2]] = [rack[s2], rack[s]];
        sel = null;
        draw();
      }
    } else {
      if (sel && sel.type === 'rack' && sel.s === s) sel = null;
      else sel = { type: 'rack', s };
      draw();
    }
  };

  addEventListener('pointermove', mv);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
});

$('g').addEventListener('pointerdown', e => {
  const clueCell = e.target.closest('.k[data-kr]');
  if (clueCell) {
    const kr = +clueCell.dataset.kr, kc = +clueCell.dataset.kc;
    const infos = W_INFO.filter(w => w.clueR === kr && w.clueC === kc);
    if (infos.length) {
      msg(infos.map(i => `${i.dir} ${i.text}`).join('   |   '));
      const set = new Set();
      W.forEach((w, idx) => {
        if (W_INFO[idx].clueR === kr && W_INFO[idx].clueC === kc) {
          w.forEach(([y, x]) => set.add(y + ',' + x));
        }
      });
      hlClue = set;
      draw();
      setTimeout(() => { if (hlClue === set) { hlClue = null; draw(); } }, 2200);
    }
    return;
  }

  const cell = e.target.closest('.c[data-r]');
  if (!cell || busy) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  const p = pend[r][c];

  if (!p) {
    if (!sol[r][c] || val[r][c]) return;
    if (sel) {
      if (sel.type === 'rack') placeFromRack(sel.s, r, c);
      else if (sel.type === 'board') moveBoardTile(sel.r, sel.c, r, c);
    }
    return;
  }

  const x0 = e.clientX, y0 = e.clientY;
  let ghost = null;

  const mv = ev => {
    if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) {
      ghost = document.createElement('div');
      ghost.className = 't gh';
      ghost.textContent = p.l;
      document.body.append(ghost);
      cell.style.opacity = '0.35';
    }
    if (ghost) {
      ghost.style.left = ev.clientX + 'px';
      ghost.style.top = (ev.clientY - 36) + 'px';
    }
  };

  const up = ev => {
    removeEventListener('pointermove', mv);
    removeEventListener('pointerup', up);
    removeEventListener('pointercancel', up);
    cell.style.opacity = '1';

    if (ghost) {
      ghost.remove();
      const el = document.elementFromPoint(ev.clientX, ev.clientY - 36);
      const targetCell = el && el.closest('.c[data-r]');
      const targetRack = el && el.closest('#rk');
      if (targetCell) {
        moveBoardTile(r, c, +targetCell.dataset.r, +targetCell.dataset.c);
      } else if (targetRack) {
        const slot = el.closest('.t[data-s]');
        returnToRack(r, c, slot ? +slot.dataset.s : null);
      }
    } else {
      returnToRack(r, c);
    }
  };

  addEventListener('pointermove', mv);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
});

$('sh').onclick = () => {
  if (busy) return;
  shuf(rack);
  sel = null;
  draw();
};

$('ht').onclick = () => {
  if (busy || !hints) return;
  const ls = rack.filter(Boolean);
  if (!ls.length) return;
  for (const l of shuf(ls.slice())) {
    const opts = [];
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        if (sol[r][c] === l && !val[r][c] && !pend[r][c]) opts.push([r, c]);
      }
    }
    if (opts.length) {
      hc = opts[Math.random() * opts.length | 0];
      hints--;
      msg(`Dica: a letra "${l}" encaixa na casa a piscar.`);
      saveActiveGame();
      draw();
      setTimeout(() => { hc = null; draw(); }, 2000);
      return;
    }
  }
};

$('go').onclick = () => {
  if (busy) return;
  busy = 1;
  let right = 0, wrong = 0;
  const lastRightCells = [];

  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      const p = pend[r][c];
      if (p) {
        if (p.l === sol[r][c]) {
          val[r][c] = p.l;
          own[r][c] = 'me';
          right++;
          lastRightCells.push([r, c]);
        } else {
          rack[p.s] = p.l;
          wrong++;
        }
        pend[r][c] = null;
      }
    }
  }

  const wordBonus = checkCompletedWords();
  const totalTurn = right + wordBonus;
  me += totalTurn;

  if (totalTurn > 0 && wordBonus === 0) {
    const last = lastRightCells[lastRightCells.length - 1];
    badges = [{ r: last[0], c: last[1], pts: '+' + totalTurn }];
    setTimeout(() => { badges = []; draw(); }, 1400);
  }

  if (right === 0 && wrong === 0) {
    msg('Passaste a vez.');
  } else {
    msg((totalTurn ? `+${totalTurn} pt${totalTurn > 1 ? 's' : ''}` : '') +
        (wordBonus ? ` (inclui +${wordBonus} bónus de palavra!)` : '') +
        (wrong ? ` (${wrong} letra${wrong > 1 ? 's' : ''} devolvida${wrong > 1 ? 's' : ''})` : ''));
  }

  sel = null;
  draw();
  if (full()) return endGame();
  setTimeout(aiTurn, 950);
};

function aiTurn() {
  const open = [];
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      if (sol[r][c] && !val[r][c]) open.push([r, c]);
    }
  }

  const aiAccuracy = Math.min(0.96, 0.68 + (LN * 0.0028));
  const maxTiles = LN > 35 ? 5 : 4;
  let placed = 0;

  shuf(open).slice(0, maxTiles).forEach(([r, c]) => {
    if (Math.random() < aiAccuracy) {
      val[r][c] = sol[r][c];
      own[r][c] = 'ai';
      placed++;
    }
  });

  const wordBonus = checkCompletedWords();
  op += placed + wordBonus;

  msg(placed ? `Oponente marcou +${placed + wordBonus} pontos.` : 'O oponente passou a vez.');
  if (full()) {
    draw();
    return endGame();
  }

  busy = 0;
  deal();
  saveActiveGame();
  draw();
}

function endGame() {
  busy = 1;
  saveData.active = null;
  if (me >= op) saveData.won[LN] = 1;
  persist();
  draw();

  setTimeout(() => {
    $('ot-title').textContent = me > op ? 'Vitória! 🎉' : me === op ? 'Empate! 🤝' : 'Derrota 😔';
    $('ot').textContent = `Você ${me} – ${op} Oponente`;
    $('nw').textContent = me >= op && LN < TOTAL_LEVELS ? `Nível ${LN + 1}` : 'Tentar de novo';
    $('ov').hidden = false;
  }, 750);
}

$('bk').onclick = showMenu;
$('ov-m').onclick = showMenu;
$('nw').onclick = () => {
  const next = (me >= op && LN < TOTAL_LEVELS) ? LN + 1 : LN;
  startLevel(next);
};

$('mn').addEventListener('click', e => {
  const btn = e.target.closest('.lv-btn');
  if (btn) startLevel(+btn.dataset.n);
});

showMenu();
</script>
</body></html>
