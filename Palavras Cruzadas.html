hasPend=()=>pend.some(r=>r.some(x=>x)),
blocked=(r,c)=>cw[r][c].some(w=>W[w].some(([y,x])=>own[y][x]==='me'||pend[y][x]));

function bonus(){let b=0;W.forEach((w,i)=>{if(!done.has(i)&&w.every(([y,x])=>val[y][x])){done.add(i);b+=w.length}});return b}

function draw(){
 let h='';
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){
  const s=sol[r][c],q=clue[r][c];
  if(!s)h+=ck(q);
  else{const v=val[r][c],p=pend[r][c];
   h+=`<div class="c ${v?own[r][c]:p?'pd':blocked(r,c)?'res':''}${hc&&hc[0]===r&&hc[1]===c?' hint':''}" data-r="${r}" data-c="${c}">${v||(p?p.l:'')}</div>`}}
 $('g').innerHTML=h;
 $('rk').innerHTML=rack.map((l,i)=>l?`<div class="t${sel===i?' sel':''}" data-s="${i}">${l}</div>`:'<div class="t e"></div>').join('');
 $('a').textContent=me;$('b').textContent=op;$('hn').textContent=hints;
 $('go').textContent=hasPend()?'Enviar':'Passar';$('go').disabled=!!busy;$('ht').disabled=!!busy||!hints}

function put(s,r,c){
 if(busy||rack[s]==null||!sol[r][c]||val[r][c]||pend[r][c])return;
 pend[r][c]={l:rack[s],s};rack[s]=null;sel=null;draw()}

$('g').addEventListener('click',e=>{
 const c=e.target.closest('.c[data-r]');if(!c||busy)return;
 const r=+c.dataset.r,k=+c.dataset.c,p=pend[r][k];
 if(p){rack[p.s]=p.l;pend[r][k]=null;draw()}else if(sel!=null)put(sel,r,k)});

$('rk').addEventListener('pointerdown',e=>{
 const t=e.target.closest('.t[data-s]');if(!t||busy)return;
 const s=+t.dataset.s,x0=e.clientX,y0=e.clientY;let g=null;
 const mv=ev=>{if(!g&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>8){g=t.cloneNode(true);g.className='t gh';document.body.append(g)}
  if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY-40+'px'}},
 up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
  if(g){g.remove();const c=document.elementFromPoint(ev.clientX,ev.clientY-40);const q=c&&c.closest('.c[data-r]');if(q)put(s,+q.dataset.r,+q.dataset.c)}
  else{sel=sel===s?null:s;draw()}};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)});

$('sh').onclick=()=>{if(busy)return;shuf(rack);draw()};

$('ht').onclick=()=>{
 if(busy||!hints)return;
 const ls=rack.filter(Boolean);if(!ls.length)return;
 for(const l of shuf(ls.slice())){const o=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(sol[r][c]===l&&!val[r][c]&&!pend[r][c])o.push([r,c]);
  if(o.length){hc=o[Math.random()*o.length|0];hints--;msg('A letra '+l+' encaixa na casa a piscar.');draw();setTimeout(()=>{hc=null;draw()},2000);return}}};

$('go').onclick=()=>{
 if(busy)return;busy=1;let n=0,bad=0;
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const p=pend[r][c];
  if(p){if(p.l===sol[r][c]){val[r][c]=p.l;own[r][c]='me';n++}else{rack[p.s]=p.l;bad++}pend[r][c]=null}}
 const b=bonus();me+=n+b;
 msg((n?'+'+n+(b?' e palavra completa +'+b:''):'Passaste a vez')+(bad?' · '+bad+' fora do sítio':''));
 sel=null;draw();
 if(full())return end();
 setTimeout(aiTurn,1000)};

function aiTurn(){
 const c=[];for(let r=0;r<R;r++)for(let k=0;k<C;k++)if(sol[r][k]&&!val[r][k]&&!blocked(r,k))c.push([r,k]);
 let n=0;shuf(c).slice(0,5).forEach(([r,k])=>{if(Math.random()<L.acc){val[r][k]=sol[r][k];own[r][k]='ai';n++}});
 const b=bonus();op+=n+b;
 msg(n?'Oponente: +'+(n+b)+(b?' (palavra completa)':''):'O oponente passou a vez');
 if(full()){draw();return end()}
 busy=0;deal();draw()}

function end(){
 busy=1;draw();if(me>op){prog[DI+'-'+LN]=1;try{localStorage.setItem('pc',JSON.stringify(prog))}catch(e){}}
 setTimeout(()=>{$('ot').textContent=(me>op?'Ganhaste! 🎉':me<op?'Perdeste.':'Empate!')+'\n'+me+' – '+op;$('ov').hidden=false},700)}

$('nw').onclick=menu;$('bk').onclick=menu;
$('mn').onclick=e=>{const b=e.target.closest('button[data-d]');if(b){document.body.className='';start(+b.dataset.d,+b.dataset.n)}};
menu();
</script></body></html>
